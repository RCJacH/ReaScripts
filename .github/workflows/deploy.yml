name: deploy
on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
    - name: Fetch repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure git
      run: |-
        git config user.name  'RCJacH'
        git config user.email 'RCJacH@outlook.com'
    - name: Install dependencies
      run: |-
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pandoc pkg-config libgit2-dev libssl-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
    - name: Install reapack-index
      run:  gem install reapack-index --pre
    - name: Update index.xml
      run:  reapack-index --commit
    - name: Push changes
      run:  git push
